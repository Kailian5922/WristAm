name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KS_FILE="$RUNNER_TEMP/wristam-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS_FILE"
            keytool -list -v -keystore "$KS_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name:|Valid from:|SHA256:"
            echo "KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "Fixed release signing keystore verified."
          else
            echo "::warning::Release keystore secrets not fully configured; falling back to ephemeral debug keystore."
          fi

      - name: Build Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-apks
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" || "$TAG_NAME" == "master" ]]; then
            TAG_NAME="v2.0.4"
          fi
          
          cp app/build/outputs/apk/release/app-release.apk "release-apks/WristAm-Wear-${TAG_NAME}.apk"
          cp phone/build/outputs/apk/release/phone-release.apk "release-apks/WristAm-Phone-${TAG_NAME}.apk"
          echo "Built APKs:"
          ls -lh release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WristAm-Release-APKs
          path: release-apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.4' }}
          name: "WristAm ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.4' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/*.apk
